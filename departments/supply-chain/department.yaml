name: supply-chain
owns: "forecast, reorder points, purchase orders, FBA shipments, expiry and FEFO, restock limits, prep partner"
status: active
jobs: ["supply-chain.daily"]          # ids in docs/jobs.json; the job defines reads, tools, steps, writes, timeout, done_when
servers: ["datadoe-read"]   # defined in docs/mcp-servers.json; a not_built server blocks the job
reads_state: ["preflight", "account-health"]
harness: claude-code                # the only harness in use; no fallback until one is tested
model: sonnet
tier:
  default: T0                       # anything not listed under classes is T0 and is refused by the runner
  classes: {}                      # Rami edits this map to promote a class; the ceo run proposes, never edits
