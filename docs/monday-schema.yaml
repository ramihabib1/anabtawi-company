# monday-schema.yaml — the monday workspace as data. bin/build-monday.py --init creates it with raw GraphQL create_column(id:)
# so column ids are explicit and stable; it writes ops/monday-ids.json (board ids) as it goes. Ids are [a-z_]{1,20}: no digits.
# Ids can never be reused after deletion, so nothing here is ever renamed; later additions are new boards or new columns.
# Verified against the account on 2026-09-06: Pro tier; views creatable by API are TABLE/FORM/DOC only; dashboard widgets cannot be
# filtered by API (filters are one-time UI clicks); no date-window filter operator exists (a build-written status stands in).
version: 2.0
workspace: "Anabtawi OS"
board_kind: public          # Main boards, so the workspace can be saved as a template later
owner_user_id: "108169876"  # Rami; every board is created with this owner

boards:
  decisions:
    name: Decisions
    groups: [Today, This week, Deferred, Done]
    columns:
      - {id: dec_id, title: Decision id, type: text}
      - {id: decision, title: Decision, type: status, labels: [Pending, Approved, Rejected, Deferred, Expired, Executing, Executed, Failed]}
      - {id: rank, title: Rank, type: numbers}
      - {id: tier, title: Tier, type: status, labels: [T2, T3]}
      - {id: dept, title: Department, type: dropdown, labels: [ceo, finance, supply-chain, advertising, catalog, pricing-intel, customer, account-health, expansion]}
      - {id: impact_cad, title: Impact CAD 30d, type: numbers}
      - {id: expires, title: Expires, type: date, time: true}
      - {id: if_ignored, title: If ignored, type: long_text}
      - {id: evidence, title: Evidence, type: long_text}
      - {id: approval_file, title: Packet, type: link}
    views:
      - {name: Today, type: TABLE, filter: {group: Today}, sort: [{column: rank, dir: asc}], column_order: [decision, if_ignored, impact_cad, expires]}
    automations:
      - "when an item is created in group Today, notify Rami"
      - "when decision changes to Approved or Rejected, notify Rami"
    writers: {decision: rami, everything_else: bin/project-monday.py}
    rule: "Rami's tap is recorded intent tonight. It is not an execution signal until the two-identity test in docs/PLAN.md passes."

  sku_profiles:
    name: SKU Profiles
    item_name: "<SKU>, <MARKET>"
    groups: [Hero, Core, Long-tail, Kill, Planned]
    columns:
      - {id: next_action, title: Next action, type: status, labels: [Nothing, Watch, Reorder now, Approve price, Fix listing, Review reviews, Blocked]}
      - {id: cover_days, title: Cover days, type: numbers}
      - {id: margin_pct, title: Margin after ads %, type: numbers}
      - {id: price, title: Price, type: numbers}
      - {id: units_seven_d, title: Units/day 7d, type: numbers}
      - {id: fba_available, title: FBA available, type: numbers}
      - {id: tacos_fourteen_d, title: TACoS 14d %, type: numbers}
      - {id: bsr, title: BSR, type: numbers}
      - {id: rating, title: Rating, type: numbers}
      - {id: marketplace, title: Marketplace, type: status, labels: [CA, US, WMT]}
      - {id: class, title: Class, type: status, labels: [Hero, Core, Long-tail, Kill]}
      - {id: listing_health, title: Listing health, type: status, labels: [Live, At risk, Suppressed]}
      - {id: data_health, title: Data health, type: status, labels: [Fresh, Stale, Broken]}
      - {id: data_asof, title: Data as-of, type: text}
    views:
      - {name: "Rami — today", type: TABLE, filter: {next_action: {not_any_of: [Nothing]}}, sort: [{column: cover_days, dir: asc}], column_order: [next_action, cover_days, margin_pct]}
    writers: {all: bin/project-monday.py}
    source: "state/skus/<date>.jsonl written by the daily build (day 2); until then Rami may type values by hand"

  run_health:
    name: Run Health
    items: [ceo, finance, supply-chain, advertising, catalog, pricing-intel, customer, account-health, expansion, ops]
    columns:
      - {id: status, title: Status, type: status, labels: [OK, Stale, Failed, Paused, Not scheduled]}
      - {id: last_run, title: Last run, type: date, time: true}
      - {id: state_date, title: State date, type: date}
      - {id: harness, title: Harness, type: dropdown, labels: [claude-code, codex, hands-runner, human]}
      - {id: tools_failed, title: Tools failed, type: text}
      - {id: log, title: Log, type: link}
    automations:
      - "when status changes to Failed or Stale, notify Rami"
    writers: {all: bin/project-monday.py}

  tasks_for_rami:
    name: Tasks for Rami
    groups: [This week, Next, Waiting, Done]
    columns:
      - {id: status, title: Status, type: status, labels: [Open, Done, "Won't do"]}
      - {id: due, title: Due, type: date}
      - {id: due_soon, title: Due soon, type: status, labels: [No, Under three days, Overdue]}
      - {id: why_human, title: Why a human, type: long_text}
      - {id: est_minutes, title: Minutes, type: numbers}
      - {id: consequence, title: If missed, type: long_text}
      - {id: dept, title: Department, type: dropdown, labels: [ceo, finance, supply-chain, advertising, catalog, pricing-intel, customer, account-health, expansion]}
      - {id: evidence, title: Evidence, type: link}
    views:
      - {name: Due soon, type: TABLE, filter: {and: [{due_soon: {any_of: [Under three days, Overdue]}}, {status: {not_any_of: [Done]}}]}}
    writers: {status: rami, everything_else: bin/project-monday.py}

dashboards:
  cockpit:
    name: Cockpit
    boards: [decisions, sku_profiles, run_health, tasks_for_rami]
    widgets:
      - {kind: BATTERY, board: run_health, status_column: status, done_text: OK, name: Company alive}
      - {kind: NUMBER, board: sku_profiles, column: cover_days, counter_type: min, name: Min cover days}
      - {kind: NUMBER, board: sku_profiles, column: margin_pct, counter_type: average, name: Margin after ads}
      - {kind: NUMBER, board: decisions, count_items: true, name: Decisions}
      - {kind: LISTVIEW, board: decisions, name: Decisions}
      - {kind: LISTVIEW, board: tasks_for_rami, name: Tasks}
    ui_clicks_after_init: ["filter Decisions widgets to group Today", "filter Min cover days to class Hero", "filter Tasks to view Due soon"]

later:
  note: "Added as new boards or columns, never renames. Column ideas are in docs/archive/DESIGN-2026-09.md §4."
  boards: [Strategy, Key Results, Initiatives, Scorecard, Scorecard History, Work Items, Projects & Milestones, Products, Suppliers & POs, Knowledge, Calendar & Blackouts, Requests, Cockpit (one-item numbers board)]
  form: "Ask the company (create_form creates its own board; route by the projection)"
  dashboards: [Finance, US Launch]
  permissions: "Decisions and any money board become Private boards when a second seat is added; until then the single seat is Rami"
