# record-schemas.yaml — the repository-side record formats. bin/validate-records.py validates the known keys of every
# record and accepts unknown keys, so new fields are free; ids, enums and money conventions are not, so they are fixed here first.
version: 1.1
conventions:
  front_matter: "a fenced ```json block immediately after the H1 title (parses with the standard library; no YAML dependency)"
  dates: "YYYY-MM-DD; timestamps ISO 8601 with the Asia/Jerusalem offset"
  money: "decimal strings with two decimals plus a currency field, never floats"
  ids:
    observation: "obs-YYYYMMDD-<dept>-NN"
    fact: "fact-<dept>-NN"
    packet: "YYYYMMDD-<dept>-<action_class>-<marketplace>-<slug>"
    work_item: "wi-YYYYMMDD-NN"
    project: "<slug>"
    pattern: "<scope>-<slug>"
    request: "YYYYMMDD-HHMM-<from>-<type>"
  enums:
    department: [ceo, finance, supply-chain, advertising, catalog, pricing-intel, customer, account-health, expansion]
    marketplace: [ca, us]
    currency: [CAD, USD]
    harness: [claude-code, codex, hands-runner, human]
    action_class: [purchase_order, pricing_band_change, price_change, listing_change, fba_shipment, campaign_create, ad_bid_change, ad_budget_change, negative_keyword, coupon, deal, buyer_message, request_a_review, vine_enrolment, reimbursement_claim, qbo_bill, strategy]
    request_type: [info, need-cash-check, need-margin-floor, stockout-risk, compliance-hold, blackout, data, review]
    verdict: [hit, miss, inconclusive, unmeasurable]
    design: [ab, prepost-matched, prepost, none]
    knowledge_status: [hypothesis, supported, validated, playbook, decaying, falsified, archived]

# ---- records in use from day 1 ----
records:
  state_file:
    path: state/<dept>.md
    header_line: "# <dept> · <YYYY-MM-DD> · job:<job id> [· tools_failed:<tool>]"
    sections: ["## Data", "## Findings", "## Proposals written", "## Requests sent", "## Blocked"]
    rules:
      - "overwritten each run; a header not dated today is a failed run"
      - "## Data is a table with the same columns every run"

  observation:
    path: departments/<dept>/memory/YYYY-MM-DD.md
    line: "- <obs-id> · <ISO time> · scope:<marketplace>/<sku|all> · <claim> · source:<export id|state line> · ledger:<seq|none>"
    required: [id, time, scope, claim, source]
    rules: ["append-only; never edited after the day"]

  fact:
    path: departments/<dept>/memory/MEMORY.md
    line: "- <fact-id> · <claim> · since:<date> · source:<id> · owner:<dept> [· superseded_by:<fact-id>]"
    rules: ["≤300 lines", "single writer per fact class", "eviction: oldest since not cited in 90 days, logged"]

  approval_packet:
    path: approvals/<pending|approved|rejected|expired|failed|executed/YYYY/MM>/<id>.md
    front_matter_schema: docs/schemas/approval-packet.schema.json
    body: ["## Proposal", "## Evidence", "## Dry run (diff, when available)"]
    rules:
      - "mode is dry-run until the hands runner exists"
      - "expires = created + 48h; expired packets are re-proposed with fresh data, never executed"

  request:
    path: requests/<to>/inbox/<id>.md → requests/<to>/done/<id>.md when answered
    front_matter: {id: string, from: department, to: department, type: request_type, needed_by: timestamp, goal_id: string|null}
    body: ["## Ask", "## Answer (appended in place)"]

  brief:
    path: briefs/YYYY-MM-DD-decisions.md
    header_line: "# decisions · <YYYY-MM-DD> · <n> items · departments ran: <list> · did not run: <list|none>"
    item_line: "<rank>. <VERB> <subject> · <number> · deadline <when> · if ignored: <one clause> · cites: state/<dept>.md#<line>"
    rules: ["≤5 items; an empty list states why"]

  product:
    path: products/<brand>/<sku>.md
    front_matter:
      sku: {required: true}
      brand: {required: true}
      name: {required: true}
      class: {enum: [hero, core, long-tail, kill]}
      lifecycle: {enum: [planned, launching, active, declining, discontinued]}
      supplier: {type: supplier id}
      case_pack: int
      moq: int
      shelf_life_days: int
      meltable: bool
      hazmat: {enum: [none, review, hazmat]}
      cost_rows: {list_of: {effective_from: date, po_ref: string, cogs: money, freight: money, duty: money, prep: money, currency: currency}}
      fees: {map_by_marketplace: {referral_pct: number, fba_fee: money, storage_unit: money, currency: currency, as_of: date, source: string}}
      listings: {map_by_marketplace: {asin: string|null, lifecycle: string, price_band: {min: money, max: money, currency: currency}, margin_floor_pct: number, safety_stock_days: int, lead_time_days: int}}
    body: ["## Notes", "## Decision history"]
    computed: {landed_cost: "sum of the current cost row", margin_after_ads_pct: "(price − landed − fees − ad_cost_per_unit) ÷ price"}

  operating_note:
    path: ops/OPERATING-NOTES.md
    line: "- <date> · <tool or harness> · <what happens> · <workaround> [· fixed:<date>]"

  calendar_entry:
    path: state/calendar.md
    line: "<kind> | <start> | <end> | <marketplace|all> | <applies_to> | <source>"

  lock:
    path: state/locks.md
    line: "<scope>:<id>:<dimension> | <dept> | <date> | expires <datetime> | <packet id|—>"

# ---- records added when their first writer exists (formats fixed now so nothing is retrofitted) ----
  ledger_entry:
    path: ledger/actions.jsonl
    schema: docs/schemas/ledger-entry.schema.json
    rules: ["append-only", "hash-chained", "only hands/ledger.py appends", "a decision row is written on every approve, reject, expire and withdraw"]

  outcome:
    path: ledger/outcomes.csv
    columns: [approval_id, goal_id, rule_refs, metric, scope, design, baseline, expected, actual, delta, delta_net_of_control, verdict, scored_on, evidence_query]
    rules: ["hit_rate and firings_90d of a rule are derived from this file by rule_refs"]

  kpi_row:
    path: ledger/kpis/YYYY-MM.csv
    columns: [date, marketplace, currency, sku, units, revenue, ad_spend, acos, tacos, contribution_margin, cover_days, price, sessions, cvr, buybox_pct, bsr, rating, reviews]

  sku_snapshot:
    path: state/skus/YYYY-MM-DD.jsonl
    rule: "one line per SKU × marketplace per day; never a monday item"

  pattern:
    path: patterns/<id>.md
    front_matter:
      id: {required: true}
      status: {enum: knowledge_status}
      claim: {required: true}
      scope: {required: true}
      first_seen: date
      last_seen: date
      confirmations: int
      contradictions: int
      confirming_days: int
      confirming_sources: int
      confirming_skus: int
      confidence: {computed: "confirmations / (confirmations + contradictions + 1) × recency; recency 1.0 ≤30d, 0.8 ≤60d, 0.6 ≤90d, 0.3 beyond"}
      seasonality_guard: bool
      threshold: {type: string|null, note: "machine-evaluable expression required before validated"}
      supersedes: string|null
      superseded_by: string|null
      next_test: string
      owner: department
    body:
      "## Evidence": "<date> · confirms|CONTRADICTS · <obs-id|ledger seq> · <note>; append-only"
      "## Reading": free text
    gates:
      supported: "confirmations ≥ 3 and confirming_days ≥ 2 and confirming_sources ≥ 2 and contradictions = 0"
      validated: "confirmations ≥ 5 and confirming_skus ≥ 2 and last_seen − first_seen ≥ 30 days and threshold set and (seasonality_guard = false or non-seasonal evidence present)"
      falsified: "contradictions > confirmations, or the monthly falsification fails"
      decaying: "last_seen > 90 days"
      archived: "last_seen > 180 days"

  skill:
    path: departments/<dept>/skills/<name>/SKILL.md
    front_matter:
      name: {required: true, rule: "lowercase, digits, hyphens; equals folder name"}
      description: {required: true, rule: "what it does and when to use it, ≤1024 chars"}
      status: {enum: [draft, validated, playbook, demoted, retired]}
      since: date
      evidence: {list_of: pattern id}
      hit_rate: {computed: "from outcomes.csv rows whose rule_refs contain this skill"}
      firings_90d: {computed: "count of packets in the last 90 days whose rule_refs contain this skill"}
      scope: string
      owner: department
      review_by: date
    rules: ["thresholds live here as numbers, never in a charter", "demote below 60% hit rate over ≥10 firings; retire below 40%"]

  lot:
    path: suppliers/lots/<po_ref>.md
    front_matter: {po_ref: string, sku: string, supplier: string, received_on: date, units: int, lot_code: string, expiry_date: date, destination: {enum: [fba-ca, fba-us, 3pl-ca, 3pl-us]}, units_remaining: int, last_counted: date}
    rules: ["nothing inbound with under 105 days remaining at receipt", "meltable inbound only 16 Oct – 14 Apr"]

  purchase_order:
    path: suppliers/pos/<po_ref>.md
    front_matter: {po_ref: string, supplier: string, approval_id: string, amount: money, currency: currency, fx: object|null, skus: list, ship_date: date|null, eta: date|null, paid_on: date|null, status: {enum: [proposed, approved, paid, shipped, received, closed]}}
    rules: ["the monthly ceiling sums amount of POs with status paid or approved in the calendar month, converted to CAD with the recorded fx"]

  supplier:
    path: suppliers/<id>.md
    front_matter: {id: string, legal_name: string, country: string, contact: string, payment_terms: string, lead_time_days_quoted: int, lead_time_days_measured: list, currency: currency, bank_on_file: bool}
    rules: ["no account number, IBAN or SWIFT is ever stored or rendered; a payment packet says 'compare against the saved payee in your bank'"]

  work_item:
    path: work/<id>.md
    front_matter: {id: string, type: {enum: [proposal, data, plan, fix, research, build, milestone]}, opened_by: "department|rami", dept: department, priority: {computed: true}, due: date|null, needed_by: date|null, project: string|null, milestone: string|null, kr_link: string|null, blocked_by: list, expected_output: {enum: [proposal, data, plan, change, decision]}, status: {enum: [open, in-progress, blocked, waiting-on-rami, answered, superseded, dropped, escalated]}}
    body: ["## Steps", "## Log"]
    rules: ["waiting-on-rami requires a matching decision or task id", "a department opens ≤5 items per other department per week"]

  project:
    path: projects/<id>.md
    front_matter: {id: string, owner_dept: department, objective: string, start: date, end: date, status: {enum: [on-track, at-risk, late, blocked, done]}, cost_cap_cad: money, spent_cad: money, critical_path: bool, slack_days: {computed: true}}
    body: "## Milestones — table: ms_id | owner | start | due | depends_on | gate | status | work_items | evidence"

  key_result:
    path: strategy/CURRENT.md (this quarter) and strategy/metrics/<metric_id>.md (definitions)
    fields: {id: string, objective: string, metric_id: string, direction: {enum: [up, down, band]}, baseline: number, target: number, current: number, as_of: date, owner_dept: department, status: {enum: [green, yellow, red, unknown]}, status_rule: {enum: [R1, R2, R3]}, cost_of_miss_cad: money, slack_weeks: number}
    rules: ["metric definitions are immutable; a change mints <metric>.v2", "current is written only by the owning department"]

  scorecard_week:
    path: strategy/scorecard/YYYY-Www.md
    table: [metric_id, kind, owner, current, prev, avg_4wk, target, status, status_rule, note]

ci_checks:
  - "bin/validate-records.py on every commit: state files, observations, packets, requests, briefs"
  - "AGENTS.md plus any department charter under 28 KiB"
  - "no file over 256 KB; no secret patterns"
  - "state files dated today at 09:00 for the departments scheduled that weekday (docs/jobs.json)"
